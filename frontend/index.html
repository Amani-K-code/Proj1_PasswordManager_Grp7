<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heha Movers Security</title><link rel="icon" type="image/jpeg" href="favicon.jpeg"><link rel="stylesheet" href="style.css"></head>
<body>
<section id="auth"><form id="authform" class="authcard">
  <div class="brand"><img src="favicon.jpeg" alt=""><span>Heha Movers Security</span></div>
  <h2 id="atitle"></h2><p id="asub" class="mut"></p>
  <label>Username<input class="in" id="auser" autocomplete="username"></label>
  <label>Master password<input class="in" id="apw" type="password" autocomplete="current-password"></label>
  <label>Confirm master password<input class="in" id="aconf" type="password"></label>
  <p id="aerr" class="err"></p>
  <button class="btn" id="abtn"></button> <a href="#" id="reset" hidden>Reset demo vault</a>
</form></section>
<div id="app" hidden>
  <aside><div class="brand"><img src="favicon.jpeg" alt=""><span>Heha Movers Security</span></div>
    <nav>
    <a href="#/dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
    <a href="#/vault"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Vault</a>
    <a href="#/add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add password</a>
    <a href="#/audit"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Security audit</a>
    <a href="#/backup"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>Backup</a>
    <a href="#/stored"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>How it's stored</a>
    </nav>
    <div class="me"><span id="who"></span><button id="out">Sign out</button></div></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><h3 id="dtitle"></h3><input class="in" id="dpw" type="password" placeholder="Master password">
  <p id="derr" class="err"></p><div class="row"><button class="btn" id="dok">Confirm</button><button id="dno">Cancel</button></div></dialog>
<script src="core.js"></script><script src="app.js"></script>
</body></html>
